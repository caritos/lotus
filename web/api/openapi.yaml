openapi: 3.0.3
info:
  title: goweb API
  version: 1.0.0
  description: JSON API for the goweb starter. This file is the source of truth for the wire types.
servers:
  - url: /
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and build info
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/login:
    post:
      operationId: login
      summary: Sign in and start a session
      description: >-
        A JSON body larger than 16 KiB is answered 400 (it is read with a 16 KiB cap), not 413;
        bodies over the global 8 MiB limit get 413 before the handler runs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/logout:
    post:
      operationId: logout
      summary: End the current session
      security: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/notes:
    get:
      operationId: listNotes
      summary: List the signed-in user's notes
      responses:
        "200":
          description: Notes, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNote
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: The created note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      summary: Get a note
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNote
      summary: Update a note's title and/or body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotePatch"
      responses:
        "200":
          description: The updated note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteNote
      summary: Delete a note
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/photo:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNotePhoto
      summary: Download the note's photo
      responses:
        "200":
          description: The photo bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    # Excluded from the Go models in oapi-codegen.yaml: the multipart body would need the oapi-codegen runtime package.
    put:
      operationId: putNotePhoto
      summary: Attach or replace the note's photo (max 5 MiB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: Image file, at most 5 MiB (5242880 bytes).
      responses:
        "200":
          description: The note with its photo attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteNotePhoto
      summary: Remove the note's photo
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: goweb_session
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request was malformed or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in, or bad credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        Cross-origin request refused: the Origin header does not match PUBLIC_ORIGIN (or, without
        Origin, Sec-Fetch-Site is not same-origin or none). Applies to every POST, PUT, PATCH and DELETE.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request body is too large (over the 8 MiB global limit, or the operation's own limit).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The uploaded file type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts; see the Retry-After header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          x-go-name: ID
        email:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Note:
      type: object
      required: [id, title, body, photo, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-name: ID
        title:
          type: string
        body:
          type: string
        photo:
          type: boolean
          description: True when the note has a photo.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds.
    NoteInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
    NotePatch:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
    Health:
      type: object
      required: [status, version, commit]
      properties:
        status:
          type: string
        version:
          type: string
        commit:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
