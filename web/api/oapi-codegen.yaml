# Models only: no router, server or client. Run via scripts/gen-api.sh.
package: apigen
output: internal/apigen/models.gen.go
generate:
  models: true
output-options:
  # multipart upload body would pull in the oapi-codegen runtime module (openapi_types.File);
  # the handler reads r.FormFile("photo") directly.
  exclude-operation-ids:
    - putNotePhoto
