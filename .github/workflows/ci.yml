name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by major version tag. For stricter supply-chain
# control, pin each one to a full commit SHA instead.

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/api/go.mod
          cache-dependency-path: web/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Go unit tests (short)
        working-directory: web/api
        run: go test -short ./...
      - name: Web unit tests
        working-directory: web
        run: pnpm test
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/api/go.mod
          cache-dependency-path: web/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build the frontend and populate the embed directory
        run: |
          cd web && pnpm build
          cd api && go build ./...
      - name: Go tests with the race detector
        working-directory: web/api
        run: go test -race ./...
      - name: Go vet
        working-directory: web/api
        run: go vet ./...
      - name: Generated code is up to date
        run: bash scripts/gen-api.sh && git diff --exit-code
      - name: Embedded app and migrations are present
        working-directory: web/api
        run: go test ./tests -run 'Embedded' -count=1
      - name: Web unit tests and typecheck
        working-directory: web
        run: |
          pnpm test
          pnpm typecheck
      - name: Deploy, backup and restore script tests
        run: bash deploy/test.sh
      - name: Generator preflight tests
        run: bash scripts/gen-api-preflight.test.sh
      - name: Hook tests
        run: bash .claude/hooks/post-edit.test.sh
      - name: Rename script test
        run: bash scripts/rename.test.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/api/go.mod
          cache-dependency-path: web/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: make e2e
      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            web/e2e/test-results
            web/e2e/playwright-report
          if-no-files-found: ignore
